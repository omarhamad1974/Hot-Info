<style>
  /* Tenders published in the last 7 days: sand background and a gold edge */
  .t-card{background:#fff;border:1px solid rgba(214,211,209,.95);border-radius:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .t-card.fresh{background:rgb(var(--c-sand-rgb) / .3);border-color:rgb(var(--c-gold-rgb) / .55);border-inline-start:4px solid rgb(var(--c-gold-rgb))}
  .t-card.past .t-when{color:#57534e}
  .t-sub{white-space:pre-line;line-height:1.9}
  .t-fact dt{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#57534e}
  .t-fact dd{margin:.125rem 0 0;font-weight:400;color:rgb(var(--c-ink-rgb))}
  /* compact filter bar: one line on desktop, wraps on phones */
  .t-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
  .t-f{position:relative;display:flex;align-items:center;min-width:0;flex:1 1 9rem}
  .t-grow{flex:3 1 14rem}.t-w{flex:2 1 10rem}.t-d{flex:0 1 9.5rem;gap:.35rem}.t-in.t-s{flex:0 0 auto;width:auto}
  .t-ic{position:absolute;inset-inline-start:.6rem;color:#78716c;font-size:1rem;pointer-events:none}
  .t-f .t-ic+.t-in{padding-inline-start:2rem}
  .t-in{width:100%;border:1px solid #8a847e;background:#fff;border-radius:.6rem;padding:.38rem .65rem;font:inherit;font-size:.8125rem;line-height:1.35;color:rgb(var(--c-ink-rgb))}
  .t-lab{font-size:.75rem;color:#57534e;white-space:nowrap}
  .t-clear{font-size:.75rem;border:1px solid #8a847e;border-radius:999px;padding:.25rem .8rem;background:#fff;color:rgb(var(--c-ink-rgb));white-space:nowrap}
  .t-clear:hover{border-color:rgb(var(--c-ink-rgb))}.t-clear.hidden,.t-f.hidden{display:none}
  @media(max-width:639px){.t-d{flex:1 1 40%}.t-in.t-s{flex:1 1 100%}}
  /* phones: search + one "Filters (n)" button; the rest opens on tap and active filters show as removable chips */
  .t-ftoggle,.t-chips{display:none}
  .t-chipx{display:inline-flex;align-items:center;gap:.35rem;min-height:2rem;max-width:100%;font-size:.75rem;border:1px solid rgb(var(--c-ink-rgb));background:rgb(var(--c-ink-rgb) / .06);color:rgb(var(--c-ink-rgb));border-radius:999px;padding-block:.25rem;padding-inline:.8rem .55rem;cursor:pointer}
  .t-chipx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:16rem}
  .t-chipx:hover{background:rgb(var(--c-ink-rgb) / .12)}
  @media(max-width:639px){
    .t-ftoggle{display:inline-flex;align-items:center;gap:.35rem;flex:0 0 auto;min-height:2.1rem;font-size:.8125rem;border:1px solid #8a847e;border-radius:.6rem;padding:.3rem .75rem;background:#fff;color:rgb(var(--c-ink-rgb));cursor:pointer}
    .t-ftoggle.on,.t-ftoggle[aria-expanded="true"]{background:rgb(var(--c-ink-rgb));color:#fff;border-color:rgb(var(--c-ink-rgb))}
    .t-grow{flex:1 1 0}.t-w{flex:1 1 100%}
    .t-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}.t-chips:empty{display:none}
    #filters:not(.f-open) .t-w,#filters:not(.f-open) #t-bar2>:not(#f-count):not(#f-clear){display:none}
  }
  .t-pill{display:inline-block;font-size:.75rem;border-radius:999px;padding:.15rem .6rem}
  .t-more{border:1px solid rgb(var(--c-ink-rgb));border-radius:999px;padding:.7rem 2rem;font-size:.875rem;background:#fff;color:rgb(var(--c-ink-rgb));cursor:pointer;transition:background .2s,color .2s}
  .t-more:hover:not(:disabled){background:rgb(var(--c-ink-rgb));color:#fff}.t-more:disabled{opacity:.6;cursor:wait}
  #notice{animation:tn .5s cubic-bezier(.16,1,.3,1)}@keyframes tn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){#notice{animation:none}}
</style>

  <form id="filters" class="hidden mt-6 card !transform-none p-3" autocomplete="off" aria-label="Filter tenders" data-i18n-attr="aria-label:tdr_filter_aria">

      <div class="t-f t-w"><i class="ph-light ph-buildings t-ic" aria-hidden="true"></i><input id="f-entity" list="entities" class="t-in" placeholder="Publishing entity" aria-label="Publishing entity" data-i18n-attr="placeholder:tdr_entity;aria-label:tdr_entity" dir="auto"><datalist id="entities"></datalist></div>
      <div class="t-f t-w"><i class="ph-light ph-stack t-ic" aria-hidden="true"></i><select id="f-sector" class="t-in" aria-label="Sector" data-i18n-attr="aria-label:tdr_sector"><option value="" data-i18n="tdr_all_sectors">All my sectors</option></select></div>

<script>
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
document.querySelectorAll('.fu').forEach(e=>io.observe(e));
</script>
<script>
const K=window.KLang,T=(k,v)=>K?K.t(k,v):k,rtl=()=>!!(K&&K.rtl);
const LOC=()=>rtl()?'ar-EG-u-nu-latn':'en-GB';
let langP=null;
// Settles the language (app-data.json holds the admin's choice), then translates the static text
const langInit=()=>langP||(langP=(async()=>{if(!K)return;try{await K.data('./app-data.json')}catch(_){}K.dom();K.fill();document.title=T('tdr_title_tag')})());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>d?new Date(d+'T00:00:00Z').toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'';
const cairoToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const daysAgo=d=>Math.round((Date.parse(cairoToday())-Date.parse(d))/864e5);
const ago=d=>{const n=daysAgo(d);return n<=0?T('ago_today'):n===1?T('ago_yday'):T('ago_days',{x:n})};
const money=r=>{const raw=r.booklet_price_raw,n=r.booklet_price;if(typeof raw==='string'&&raw.trim())return raw.trim();return n==null?'':Number(n).toLocaleString('en-US',{maximumFractionDigits:2})};
const PAGE=30,RECENT_PAGE=100;
let sb=null,sectorName={},since=null,token=0;
// R = what is on screen. recent/older: rows loaded and the total the database reports for the current filters.
let R={recent:{rows:[],total:0},older:{rows:[],total:0,open:false}};

const readF=()=>({q:$('f-q').value.trim(),entity:$('f-entity').value.trim(),sector:$('f-sector').value,by:$('f-by').value,from:$('f-from').value||null,to:$('f-to').value||null});
const active=f=>!!(f.q||f.entity||f.sector||f.from||f.to);
// Phones: the filters behind the "Filters (n)" button show as chips you can remove one by one. n counts the filters inside the panel (not the search box).
function syncFilterUI(){
  const f=readF(),c=[];
  if(f.entity)c.push(['entity',f.entity]);
  if(f.sector){const o=$('f-sector').selectedOptions[0];c.push(['sector',sectorName[f.sector]||(o&&o.text)||f.sector])}
  if(f.from||f.to)c.push(['dates',(f.by==='session'?T('tdr_session'):T('tdr_published'))+': '+(f.from?day(f.from):'…')+' – '+(f.to?day(f.to):'…')]);
  $('f-chips').innerHTML=c.map(([k,t])=>`<button type="button" class="t-chipx" data-rm="${k}" aria-label="${esc(T('tdr_rm',{x:t}))}"><span>${esc(t)}</span><i class="ph-light ph-x" aria-hidden="true"></i></button>`).join('');
  $('f-n').textContent=c.length?` (${c.length})`:'';
  $('f-toggle').classList.toggle('on',c.length>0);
}
const params=(scope,f,offset,limit)=>({p_scope:scope,p_from:f.from,p_to:f.to,p_date_by:f.by,p_entity:f.entity||null,p_sector:f.sector||null,p_q:f.q||null,p_limit:limit,p_offset:offset});
async function fetchTenders(scope,f,offset,limit){
  const {data,error}=await sb.rpc('my_tenders',params(scope,f,offset,limit));
  if(error)throw error;return data||{total:0,rows:[]};
}

function note(icon,t,sub,btn){
  $('filters').classList.add('hidden');$('notice').classList.add('hidden');
  $('list').innerHTML=`<div class="card !transform-none p-10 text-center max-w-xl"><i class="ph-light ${icon} text-5xl text-stone-600"></i><p class="mt-3 font-display text-2xl font-semibold text-title">${t}</p>${sub?`<p class="mt-1 text-sm text-stone-600">${sub}</p>`:''}${btn?`<button id="go-login" class="auth-btn mt-5" style="margin:1.25rem auto 0"><i class="ph-light ph-user"></i><span style="display:inline">${T('tdr_login')}</span></button>`:''}</div>`;
  if(btn)$('go-login').onclick=()=>KHIPAuth.open();
}
const skeleton=()=>{$('list').innerHTML='<div class="grid gap-4">'+'<div class="t-card p-6 animate-pulse h-40"><div class="h-5 w-1/2 rounded bg-stone-200"></div><div class="h-4 w-5/6 rounded bg-stone-100 mt-4"></div><div class="h-4 w-2/3 rounded bg-stone-100 mt-3"></div></div>'.repeat(3)+'</div>'};

function card(r,fresh){
  const isNew=since&&r.released_at&&Date.parse(r.released_at)>Date.parse(since);
  const sess=r.session_date?day(r.session_date)+(r.session_time?' · '+esc(String(r.session_time).slice(0,5)):''):'';
  const passed=r.session_date&&r.session_date<cairoToday();
  const link=/^https?:\/\//i.test(r.link||'')?r.link:'';
  const chips=(r.sector_ids||[]).map(id=>`<span class="t-pill bg-brand-50 text-brand-700">${esc(sectorName[id]||id)}</span>`).join(' ');
  const fact=(k,v,ar)=>v?`<div><dt>${k}</dt><dd${ar?' dir="rtl" lang="ar" class="text-right sm:text-left rtl:sm:text-right"':''}>${v}</dd></div>`:'';
  return `<article class="t-card ${fresh?'fresh':''} ${passed?'past':''} p-5 sm:p-6">
    <div class="flex flex-wrap items-center gap-2 mb-3">
      ${fresh?`<span class="t-pill bg-ink text-white">${T('tdr_last7')}</span>`:''}${isNew?`<span class="t-pill bg-brand-600 text-white">${T('tdr_new')}</span>`:''}
      <span class="t-when text-xs text-stone-600">${esc(T('tdr_pub_on',{x:day(r.publish_date)}))}${r.publish_date?' · '+ago(r.publish_date):''}${r.source_paper?' · '+esc(r.source_paper)+(r.page?', '+esc(T('tdr_pg',{x:r.page})):''):''}</span>
      <span class="ms-auto flex flex-wrap gap-1.5">${chips}</span></div>
    <h3 dir="rtl" lang="ar" class="font-display text-2xl font-semibold text-title leading-snug text-right">${esc(r.entity||'—')}</h3>
    <p dir="rtl" lang="ar" class="t-sub mt-2 text-[15px] text-ink text-right">${esc(r.subject||'—')}</p>
    <dl class="t-fact mt-4 pt-4 border-t border-stone-200/80 grid gap-x-6 gap-y-3 grid-cols-2 md:grid-cols-4">
      ${fact(T('tdr_f_session'),sess?esc(sess)+(passed?` <span class="t-pill bg-stone-200 text-stone-700">${T('tdr_passed')}</span>`:''):'')}
      ${fact(T('tdr_f_price'),esc(money(r)),true)}
      ${fact(T('tdr_f_bond'),esc(r.bid_bond||''),true)}
      <div class="flex items-end justify-end gap-2 col-span-2 md:col-span-1">${r.has_image?`<button data-view="${esc(r.id)}" class="text-sm border border-stone-300 hover:border-stone-500 bg-white text-ink px-4 py-2 rounded-full transition whitespace-nowrap"><i class="ph-light ph-eye"></i> ${T('tdr_view')}</button>`:''}${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="text-sm bg-ink hover:bg-stone-800 text-white px-4 py-2 rounded-full transition whitespace-nowrap"><i class="ph-light ph-arrow-square-out"></i> ${T('tdr_source')}</a>`:''}</div>
    </dl></article>`;
}

function paint(){
  const f=readF(),rc=R.recent,ol=R.older,filtering=active(f);
  $('f-clear').classList.toggle('hidden',!filtering);syncFilterUI();
  const total=rc.total+(ol.open?ol.total:0);
  let h='';
  h+=`<h2 class="text-xs uppercase tracking-wider text-stone-600 mb-3">${T('tdr_h_recent')} <span class="normal-case tracking-normal">(${rc.total})</span></h2>`;
  if(rc.rows.length)h+=`<div class="grid gap-4">${rc.rows.map(r=>card(r,true)).join('')}</div>`;
  else h+=`<p class="text-sm text-stone-600 bg-white/70 border border-stone-200 rounded-xl px-4 py-3">${T(filtering?'tdr_none_recent_f':'tdr_none_recent')}</p>`;
  if(rc.rows.length<rc.total)h+=`<div class="text-center mt-5"><button class="t-more" data-more="recent">${T('tdr_more_recent',{x:rc.total-rc.rows.length})}</button></div>`;
  if(!ol.open)h+=`<div class="text-center mt-8"><button class="t-more" data-more="older"><i class="ph-light ph-clock-counter-clockwise"></i> ${T('tdr_more_older')}</button><p class="text-xs text-stone-600 mt-2">${T('tdr_older_hint')}</p></div>`;
  else{
    h+=`<h2 class="text-xs uppercase tracking-wider text-stone-600 mt-10 mb-3">${T('tdr_h_older')} <span class="normal-case tracking-normal">(${ol.total})</span></h2>`;
    h+=ol.rows.length?`<div class="grid gap-4">${ol.rows.map(r=>card(r,false)).join('')}</div>`:`<p class="text-sm text-stone-600 bg-white/70 border border-stone-200 rounded-xl px-4 py-3">${T(filtering?'tdr_none_older_f':'tdr_none_older')}</p>`;
    if(ol.rows.length<ol.total)h+=`<div class="text-center mt-6"><button class="t-more" data-more="older">${T('tdr_more_left',{x:ol.total-ol.rows.length})}</button></div>`;
  }
  $('list').innerHTML=h;
  $('f-count').textContent=ol.open||!rc.total&&!rc.rows.length?T('tdr_count',{x:total}):T('tdr_rcount',{x:rc.total});
}

async function load(){
  const my=++token,f=readF();skeleton();
  try{
    const rc=await fetchTenders('recent',f,0,RECENT_PAGE);if(my!==token)return;
    R={recent:{rows:rc.rows,total:rc.total},older:{rows:[],total:0,open:false}};
    // Nothing new in the last 7 days but the person is searching: go straight to older tenders
    if(!rc.total&&active(f)){const ol=await fetchTenders('older',f,0,PAGE);if(my!==token)return;R.older={rows:ol.rows,total:ol.total,open:true}}
    paint();
  }catch(e){if(my===token)note('ph-warning-circle',T('tdr_load_err'),/my_tenders|function/i.test(e.message||'')?T('tdr_not_setup'):T('tdr_refresh'))}
}
async function more(which,btn){
  const f=readF(),my=token;btn.disabled=true;const t=btn.innerHTML;btn.textContent=T('tdr_loading');
  try{
    const part=R[which],d=await fetchTenders(which,f,which==='older'&&!part.open?0:part.rows.length,which==='recent'?RECENT_PAGE:PAGE);if(my!==token)return;
    part.rows=part.rows.concat(d.rows);part.total=d.total;if(which==='older')part.open=true;paint();
  }catch(e){btn.disabled=false;btn.innerHTML=t;alert(T('tdr_more_fail'))}
}

async function view(id,btn){
  const w=window.open('','_blank');if(!w)return alert(T('tdr_popup'));
  w.document.write('<p style="font-family:sans-serif;padding:2rem">'+esc(T('tdr_opening'))+'</p>');btn.disabled=true;
  try{
    // The database hands out the file path only for tenders the person may read; the storage policy checks it again.
    const {data:p,error}=await sb.rpc('my_tender_image',{p_tender:id});if(error||!p)throw error||new Error('none');
    const {data,error:e2}=await sb.storage.from('tender-images').createSignedUrl(p,300);if(e2)throw e2;
    w.location.href=data.signedUrl;
  }catch(e){w.close();alert(T('tdr_open_fail'))}
  btn.disabled=false;
}

async function setup(){
  const A=KHIPAuth;
  await langInit();
  if(!A.client())return note('ph-plug',T('tdr_signin_na'),T('tdr_later'));
  if(!A.user()){$('who').textContent=T('tdr_signin_txt');return note('ph-lock-simple',T('tdr_please'),T('tdr_private'),true)}
  sb=A.client();skeleton();
  const [fl,nt]=await Promise.all([sb.rpc('my_tender_filters'),sb.rpc('tender_notice')]);
  if(fl.error)return note('ph-warning-circle',T('tdr_not_setup_t'),T('tdr_later'));
  const sectors=fl.data.sectors||[];sectorName=Object.fromEntries(sectors.map(s=>[s.id,s.name]));
  if(!sectors.length)return note('ph-stack',T('tdr_no_sub'),T('tdr_no_sub_sub'));
  $('who').textContent=sectors.length===1?T('tdr_who1',{x:sectors[0].name}):T('tdr_whon',{x:sectors.length});
  $('f-sector').innerHTML=`<option value="">${esc(T('tdr_all_sectors'))}</option>`+sectors.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  $('f-sector').parentElement.classList.toggle('hidden',sectors.length<2);
  $('entities').innerHTML=(fl.data.entities||[]).map(e=>`<option value="${esc(e)}">`).join('');
  $('filters').classList.remove('hidden');
  // The notice: shown here too, then marked as seen so the next visit counts from now
  const n=nt.data||{};since=n.since||null;
  if(n.count>0){$('notice').classList.remove('hidden');$('notice').classList.add('flex');
    $('notice').innerHTML=`<span class="w-12 h-12 rounded-full bg-white/80 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ph-bell-ringing text-2xl"></i></span><p class="text-ink"><b class="font-medium">${esc(T('tdr_nt_count',{n:n.count}))}</b>${esc(T('tdr_nt_rest',{d:n.since?` (${new Date(n.since).toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'})})`:''}))}<span class="t-pill bg-brand-600 text-white">${T('tdr_new')}</span>${esc(T('tdr_nt_end'))}</p>`}
  else{$('notice').classList.add('hidden');$('notice').classList.remove('flex')}
  sb.rpc('tender_mark_seen').then(()=>{window.KHIPTenderNotice&&KHIPTenderNotice.clear()});
  load();
}

let dt=null;
$('filters').addEventListener('submit',e=>e.preventDefault());
$('filters').addEventListener('input',e=>{if(e.target.id==='f-q'||e.target.id==='f-entity'){clearTimeout(dt);dt=setTimeout(load,350)}});
$('filters').addEventListener('change',e=>{if(e.target.id!=='f-q'&&e.target.id!=='f-entity'){
  if(e.target.id==='f-by'&&!$('f-from').value&&!$('f-to').value)return;load()}});
$('f-toggle').onclick=()=>{const o=$('filters').classList.toggle('f-open');$('f-toggle').setAttribute('aria-expanded',String(o))};
$('f-chips').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const k=b.dataset.rm;
  if(k==='entity')$('f-entity').value='';else if(k==='sector')$('f-sector').value='';else if(k==='dates')$('f-from').value=$('f-to').value='';load()});
$('f-clear').onclick=()=>{$('f-q').value=$('f-entity').value=$('f-from').value=$('f-to').value='';$('f-sector').value='';$('f-by').value='publish';load()};
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-more]'),v=e.target.closest('[data-view]');
  if(m)more(m.dataset.more,m);else if(v)view(v.dataset.view,v);
});
KHIPAuth.onChange(()=>{token++;setup()});
KHIPAuth.ready.then(setup);
</script>

  <section data-sec="home-carousel" class="wrap pt-5 md:pt-8"><div id="carousel" class="relative h-60 sm:h-80 lg:h-[27rem] rounded-3xl overflow-hidden shadow-xl bg-ink" aria-roledescription="carousel"></div></section>

  <section id="about" data-sec="home-about" class="band"><div class="wrap grid md:grid-cols-[minmax(0,9.5rem)_1fr] lg:grid-cols-[minmax(0,11rem)_1fr] gap-8 md:gap-10 lg:gap-14 items-center">
    <div class="fu flex justify-center"><img data-brand-logo src="assets/khip-logo.jpg?v=2" width="800" height="822" alt="Khaled Hamada Intellectual Property" class="about-logo w-56 sm:w-64 md:w-full max-w-[22rem] md:max-w-[9.5rem] lg:max-w-[11rem] h-auto" decoding="async"></div>
    <div class="fu text-center md:text-start" style="--d:.15s"><span class="rule mx-auto md:mx-0 !mt-0"></span><p id="about-text" class="text-base md:text-lg leading-relaxed"></p>

    <a href="directory.html?offers=1" class="of-all"><span data-i18n="offers_all">All offers</span> <i class="ph-light ph-arrow-right flip" aria-hidden="true"></i></a></div>

    <div id="m-scroll" class="max-h-[calc(100dvh_-_var(--khip-h,0px)_-_1.5rem)] overflow-y-auto overscroll-contain p-6 md:p-9 pb-10"><div id="m-body" class="space-y-4"></div></div>

<script src="rich.js"></script>
<script src="blocks.js"></script>
<script src="footer.js"></script>
<script src="auth.js"></script>
<script>
const SHOW_PRODUCTS=false; // products / search reports hidden for now
const DATA_URL="./app-data.json", CACHE="khip-data-v3";
const CODES={egypt:'eg',uae:'ae','united arab emirates':'ae','saudi arabia':'sa',jordan:'jo',kuwait:'kw',qatar:'qa',bahrain:'bh',oman:'om',morocco:'ma',tunisia:'tn',algeria:'dz',libya:'ly',lebanon:'lb',iraq:'iq',syria:'sy',yemen:'ye',sudan:'sd',palestine:'ps',turkey:'tr'};
const FALLBACK_IMG="https://placehold.co/600x400/e7e5e4/78716c?text=HOT+INFORMATION";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Images: a bare file name such as "logo.jpg" is looked up in ./assets/
const img=u=>!u?FALLBACK_IMG:esc(kv(/^(https?:\/\/|\.\/|\/|data:image)/.test(u)?u:'./assets/'+u));
const flag=j=>{const c=String(j.code||CODES[(j.enCountry||j.country||'').toLowerCase()]||'').toLowerCase();return /^[a-z]{2}$/.test(c)?`<span class="fi fi-${c} rounded-sm shadow-sm" role="img" aria-label="${esc(KLang.t('flag_aria',{x:j.country}))}"></span>`:'<i class="ph-light ph-globe-hemisphere-west text-brand-600"></i>'};
const ICONS=[[/patent/i,'ph-lightbulb'],[/trade\s?mark/i,'ph-seal-check'],[/transl/i,'ph-translate'],[/design/i,'ph-pencil-ruler'],[/copyright/i,'ph-copyright'],[/search/i,'ph-magnifying-glass']];
const icon=x=>/^ph-/.test(x.icon||'')?esc(x.icon.replace(/^ph-light\s*/,'')):(ICONS.find(([r])=>r.test(x.title||''))||[0,'ph-seal-check'])[1];
const show=(id,on)=>$(id).classList.toggle('hidden',!on);
const imgErr='onerror="this.onerror=null;this.src=FALLBACK_IMG"';
// A picture with its optional colour overlay and SVG mask (set in the admin, see theme.js > KFX). With no effect it is a plain <img>.
const fxImg=(x,cls,lazy)=>KFX.img({fx:x.imageFx,T:D.theme,src:img(x.image),attrs:`${lazy?'loading="lazy" ':''}${imgErr} alt="${esc(x.alt||'')}"`,cls});
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let D={},hot=[],hotLoaded=false,slide=0,timer=null,lastFocus=null;

async function load(){
  const ck=()=>CACHE+(KLang.rtl?'-ar':'');
  const first=ck();let cached=null;try{cached=JSON.parse(localStorage.getItem(first))}catch{}
  if(cached){D=cached;render()}
  try{
    const fresh=await KLang.data(DATA_URL);          // English data, plus Arabic on top when Arabic is showing
    if(JSON.stringify(fresh)!==JSON.stringify(cached)||ck()!==first){D=fresh;try{localStorage.setItem(ck(),JSON.stringify(fresh))}catch{}render()}
    show('error',false);
  }catch(e){console.warn('Data load failed',e);if(!cached)show('error',true)}
}

function render(){
  KLang.dom();
  $('about-text').innerHTML=KRich.card(D.aboutMainText||D.about||'');
  KHIP.setPrompts(D.chatPrompts);
  const s=D.social||{};
  carousel(D.carousel||[]);
  hotInit();
  offersInit();
  list('services',D.services,(x,i)=>`<div class="fu" style="--d:${(i%3)*.12}s"><div class="card h-full p-5 md:p-7 flex md:flex-col gap-4 md:gap-5 items-start"><div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ${icon(x)} text-2xl md:text-3xl"></i></div><div class="flex flex-col flex-1"><h3 class="font-display text-2xl font-semibold text-title">${esc(x.title)}</h3><p class="text-sm leading-relaxed mt-1.5 line-clamp-5 md:line-clamp-3">${KRich.plain(x.description)}</p><button data-act="service" data-i="${i}" class="mt-4 self-start text-sm border border-ink/30 hover:bg-ink hover:text-white px-6 py-1.5 rounded-full transition">${KLang.t('more')}</button></div></div></div>`);
  list('news',D.news,x=>`<button data-act="news" data-id="${esc(x.id)}" class="ncard card w-[17rem] sm:w-80 text-start overflow-hidden">${fxImg(x,'w-full h-40 object-cover',1)}<div class="p-5"><span class="cat-tag">${esc(cat(x))}</span>${x.date?`<span class="text-xs text-stone-600 ms-2">${esc(x.date)}</span>`:''}<h3 class="font-display text-xl font-semibold text-title leading-snug line-clamp-2 mt-1.5">${esc(x.title)}</h3><p class="text-sm mt-2 line-clamp-3">${KRich.plain(x.excerpt)}</p></div></button>`);
  news();
  list('testimonials',D.testimonials,(x,i)=>`<div class="tcard${i?'':' on'} text-center flex flex-col items-center justify-center"><p class="font-display text-lg md:text-xl lg:text-2xl leading-snug text-ink">${esc(x.text)}</p><h4 class="mt-5 font-medium text-title">${esc(x.name)}</h4><span class="text-sm text-stone-600">${esc(x.role)}</span></div>`);
  auto($('news-list'));
  testi();observeFu();
  const h=location.hash.slice(1);
  if(h.startsWith('news-'))openNews(h.slice(5));
  else if(h&&!render.done&&$(h))setTimeout(()=>$(h).scrollIntoView(),80);
  render.done=1;
}
function list(id,items,fn){items=items||[];show(id,items.length);$(id+'-list').innerHTML=items.map(fn).join('')}

// Auto-moving parts stop while hovered, touched or focused, and resume 2.5s after
function watch(el){
  if(el._w)return;el._w=1;
  const hold=()=>{el._hold=true},free=()=>{el._wait=Date.now()+2500;el._hold=false};
  ['mouseenter','focusin','touchstart','pointerdown'].forEach(v=>el.addEventListener(v,hold,{passive:true}));
  ['mouseleave','focusout','touchend','pointerup'].forEach(v=>el.addEventListener(v,e=>{if(e.type==='pointerup'&&e.pointerType==='mouse')return;free()},{passive:true}));
}
const paused=el=>KPAUSE.on||el._hold||Date.now()<(el._wait||0);
function auto(el,ms=3500){
  if(el._a)return;el._a=1;watch(el);
  setInterval(()=>{
    if(REDUCED||paused(el)||!el.firstElementChild)return;
    const step=(el.firstElementChild.offsetWidth+16)*(KLang.rtl?-1:1);
    if(Math.abs(el.scrollLeft)+el.clientWidth>=el.scrollWidth-6)el.scrollTo({left:0,behavior:(window.kSmooth?kSmooth():'smooth')});else el.scrollBy({left:step,behavior:(window.kSmooth?kSmooth():'smooth')});
  },ms);
}
// Testimonials: one at a time in a frame; every 10 seconds the quote fades out, then the next fades in
let ti=0;
function testi(){
  const n=(D.testimonials||[]).length;ti=0;
  $('t-dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<button data-act="tslide" data-i="${i}" aria-label="${esc(KLang.t('testimonial_n',{x:i+1}))}" class="td h-1.5 rounded-full transition-all duration-500 ${i?'w-2 bg-stone-300':'w-7 bg-ink'}"></button>`).join(''):'';
  watch($('testimonials'));
  if(!testi.t)testi.t=setInterval(()=>{const m=(D.testimonials||[]).length;if(!REDUCED&&m>1&&!paused($('testimonials')))setT((ti+1)%m)},10000);
}
function setT(i){
  const cards=[...document.querySelectorAll('.tcard')];if(!cards[i])return;
  clearTimeout(setT.w);cards.forEach(c=>c.classList.remove('on'));            // fade out
  document.querySelectorAll('.td').forEach((d,k)=>{d.classList.toggle('w-7',k===i);d.classList.toggle('bg-ink',k===i);d.classList.toggle('w-2',k!==i);d.classList.toggle('bg-stone-300',k!==i)});
  ti=i;
  setT.w=setTimeout(()=>cards[i].classList.add('on'),REDUCED?0:750);               // then fade in
}

// News on mobile: one wide, centred card at a time, fading in and out (desktop keeps the scrolling row; see styles.css)
let ni=0;
function news(){
  const n=(D.news||[]).length,L=$('news-list');ni=0;
  L.querySelectorAll('.ncard').forEach((c,k)=>c.classList.toggle('on',k===0));
  $('news-dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<button data-act="nslide" data-i="${i}" aria-label="${esc(KLang.t('news_n',{x:i+1}))}" class="nd h-1.5 rounded-full transition-all duration-500 ${i?'w-2 bg-stone-300':'w-7 bg-ink'}"></button>`).join(''):'';
  watch($('news'));
  if(!news.t){
    news.t=setInterval(()=>{const m=(D.news||[]).length;if(!REDUCED&&m>1&&matchMedia('(max-width:767px)').matches&&!paused($('news')))setN((ni+1)%m)},6000);
    let x0=null;
    L.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
    L.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,m=(D.news||[]).length;x0=null;
      if(m>1&&matchMedia('(max-width:767px)').matches&&Math.abs(dx)>40)setN((ni+((dx<0)!==KLang.rtl?1:-1)+m)%m)},{passive:true});
  }
}
function setN(i){
  document.querySelectorAll('#news-list>.ncard').forEach((c,k)=>c.classList.toggle('on',k===i));
  document.querySelectorAll('.nd').forEach((d,k)=>{d.classList.toggle('w-7',k===i);d.classList.toggle('bg-ink',k===i);d.classList.toggle('w-2',k!==i);d.classList.toggle('bg-stone-300',k!==i)});
  ni=i;
}

function carousel(slides){
  clearInterval(timer);slide=0;const c=$('carousel');
  c.parentElement.classList.toggle('hidden',!slides.length);
  c.innerHTML=slides.map((s,i)=>`<div class="slide absolute inset-0 ${i?'':'on'}">${fxImg(s,'w-full h-full object-cover opacity-80')}<div class="absolute inset-0 bg-gradient-to-t from-ink/90 via-ink/50 to-ink/10 p-6 md:p-12 flex flex-col justify-end text-white"><h2 class="font-display text-3xl md:text-5xl font-medium leading-tight max-w-2xl [text-shadow:0_1px_4px_rgba(0,0,0,.45)]">${esc(s.title)}</h2><p class="text-sm md:text-base text-stone-100 mt-2 max-w-xl [text-shadow:0_1px_3px_rgba(0,0,0,.5)]">${esc(s.subtitle)}</p></div></div>`).join('');
  if(slides.length>1){
    const go=()=>{clearInterval(timer);if(!REDUCED&&!KPAUSE.on)timer=setInterval(()=>setSlide((slide+1)%slides.length),10000)};go();
    c.onmouseenter=()=>clearInterval(timer);c.onmouseleave=go;
    if(!REDUCED){   // pause / play for everything that moves by itself on the page (WCAG 2.2.2)
      c.insertAdjacentHTML('beforeend','<button type="button" id="k-pause"><i class="ph-light"></i></button>');
      const b=$('k-pause'),sync=()=>{const t=KLang.t(KPAUSE.on?'play_motion':'pause_motion');b.setAttribute('aria-label',t);b.title=t;b.setAttribute('aria-pressed',String(KPAUSE.on));b.firstChild.className='ph-light '+(KPAUSE.on?'ph-play':'ph-pause')};
      sync();b.onclick=()=>{KPAUSE.set(!KPAUSE.on);sync();KPAUSE.on?clearInterval(timer):go()};
    }
    let x0=null;c.ontouchstart=e=>{x0=e.touches[0].clientX;clearInterval(timer)};
    c.ontouchend=e=>{if(x0!==null){const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)setSlide((slide+((dx<0)!==KLang.rtl?1:-1)+slides.length)%slides.length);x0=null}go()};
  }
}
function setSlide(i){
  const s=document.querySelectorAll('.slide');if(!s[i])return;
  s[slide].classList.remove('on');slide=i;s[i].classList.add('on');
}

// HOT News: sectors that have active tenders (description + publishing entity only; see supabase-step13-hot-news.sql)
const hotName=x=>KLang.rtl&&x.name_ar?x.name_ar:x.name;
// Front-page tender preview: at most 50 words, the publishing entity and the publishing date; "More" opens the whole tender (hot_tender)
const hotWords=(s,n=50)=>{const w=String(s||'').trim().split(/\s+/);return w.length>n?w.slice(0,n).join(' ')+'\u2026':w.join(' ')};
const hotDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||''));if(!m)return String(d||'');try{return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).toLocaleDateString(KLang.rtl?'ar-EG':'en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}catch{return m[0]}};
function hotView(t,full){
  const row=(ic,l,v)=>v?`<div class="flex items-start gap-2 text-sm"><i class="ph-light ${ic} text-lg text-brand-600 flex-shrink-0 mt-0.5"></i><div class="min-w-0"><p class="text-xs text-stone-600">${esc(KLang.t(l))}</p><p dir="auto" class="font-semibold">${esc(v)}</p></div></div>`:'';
  return `<h3 id="m-title" dir="auto" class="font-display text-2xl md:text-3xl font-semibold text-title pe-10 leading-tight">${esc(t.entity||KLang.t('hot_entity'))}</h3>`
    +`<div class="grid sm:grid-cols-2 gap-3">${row('ph-calendar-blank','hot_pub',t.publish_date?hotDate(t.publish_date):'')}${row('ph-map-pin','hot_gov',t.governorate)}${row('ph-gavel','hot_session',t.session_date?hotDate(t.session_date):'')}</div>`
    +`<p dir="auto" class="leading-relaxed whitespace-pre-line">${esc(t.subject||'')}</p>${full?'':'<p class="text-xs text-stone-600">\u2026</p>'}`
    +`<p class="text-xs text-stone-600">${esc(KLang.t('hot_sub_only'))}</p><a href="tenders.html" class="inline-flex items-center gap-2 bg-ink hover:bg-stone-800 text-white text-sm px-6 py-2.5 rounded-full transition self-start"><i class="ph-light ph-gavel"></i>${esc(KLang.t('hot_cta'))}</a>`;
}
async function openTender(id){
  const t=hot.flatMap(x=>x.tenders||[]).find(x=>String(x.id)===String(id));if(!t)return;
  openModal(hotView(t,false));
  try{
    const C=window.KHIP_SUPABASE,r=await fetch(C.url+'/rest/v1/rpc/hot_tender',{method:'POST',headers:{apikey:C.anonKey,Authorization:'Bearer '+C.anonKey,'Content-Type':'application/json'},body:JSON.stringify({p_id:id})});
    if(!r.ok)throw new Error('HTTP '+r.status);const f=await r.json();
    if(!f){$('m-body').innerHTML=`<p class="text-sm">${esc(KLang.t('hot_gone'))}</p>`;return}
    $('m-body').innerHTML=hotView(f,true);
  }catch(e){console.warn('Tender detail not loaded',e);$('m-body').innerHTML=hotView(t,true)}
}

// ---- Limited offers: approved directory entries that have a running offer (offer_title, optional end date). Shown above the testimonials.
let offers=[],offersLoaded=false,cfgP=null;
const cairoDay=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const offerOn=e=>!!(e&&e.offer_title)&&(!e.offer_ends||e.offer_ends>=cairoDay());
const loadCfg=()=>window.KHIP_SUPABASE?Promise.resolve():(cfgP||(cfgP=new Promise((ok,no)=>{const e=document.createElement('script');e.src='supabase-config.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)})));
async function offersInit(){
  if(offersLoaded){offersPaint();return}
  offersLoaded=true;
  try{const c=JSON.parse(sessionStorage.getItem('khip-offers-v1'));if(Array.isArray(c)){offers=c;offersPaint()}}catch{}
  try{
    await loadCfg();
    const C=window.KHIP_SUPABASE;if(!C||/YOUR-/.test(C.url||''))return;
    const q='select=id,name,name_ar,entry_type,city,offer_title,offer_text,offer_ends,image_path&status=eq.approved&offer_title=not.is.null&order=offer_ends.asc.nullslast&limit=60';
    const r=await fetch(C.url+'/rest/v1/directory_entries?'+q,{headers:{apikey:C.anonKey,Authorization:'Bearer '+C.anonKey}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    offers=await r.json();try{sessionStorage.setItem('khip-offers-v1',JSON.stringify(offers))}catch{}
  }catch(e){console.warn('Offers not loaded',e)}
  offersPaint();
}
function offersPaint(){
  const T=KLang.t,loc=KLang.rtl?'ar-EG-u-nu-latn':'en-GB',C=window.KHIP_SUPABASE||{},today=cairoDay();
  const list=offers.filter(offerOn).sort((a,b)=>(a.offer_ends||'9999-12-31').localeCompare(b.offer_ends||'9999-12-31')).slice(0,12);
  show('offers',list.length);
  const ICO={company:'ph-buildings',institution:'ph-bank',freelancer:'ph-user'};
  $('offers-list').innerHTML=list.map((e,i)=>{
    const left=e.offer_ends?Math.round((Date.parse(e.offer_ends)-Date.parse(today))/864e5):null;
    const when=left==null?T('offers_open'):left<=0?T('offers_ends_today'):left===1?T('offers_1day'):left<=14?T('offers_days',{x:left}):T('offers_until',{x:new Date(e.offer_ends+'T00:00:00Z').toLocaleDateString(loc,{day:'numeric',month:'short',timeZone:'UTC'})});
    const name=(KLang.rtl&&e.name_ar)||e.name,ico=ICO[e.entry_type]||'ph-buildings';
    const pic=e.image_path&&C.url?kv(C.url+'/storage/v1/object/public/directory-images/'+String(e.image_path).split('/').map(encodeURIComponent).join('/')):'';
    return `<div class="fu" style="--d:${(i%3)*.1}s"><a href="directory-entry.html?id=${encodeURIComponent(e.id)}" class="of-card">`
      +`<span class="of-img${pic?' has-img':''}">${pic?`<img src="${esc(pic)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:`<i class="ph-light ${ico}" aria-hidden="true"></i>`}<span class="of-badge" aria-hidden="true"><i class="ph-light ph-tag"></i></span><span class="of-when${left!=null&&left<=3?' hot':''}"><i class="ph-light ph-clock" aria-hidden="true"></i> ${esc(when)}</span></span>`
      +`<span class="of-body"><span class="of-ent" dir="auto"><i class="ph-light ${ico}" aria-hidden="true"></i><span class="truncate">${esc(name)}${e.city?' \u00b7 '+esc(e.city):''}</span></span>`
      +`<span class="of-t font-display" dir="auto">${esc(e.offer_title)}</span>${e.offer_text?`<span class="of-d" dir="auto">${esc(e.offer_text)}</span>`:''}`
      +`<span class="of-cta">${esc(T('offers_cta'))} <i class="ph-light ph-arrow-right flip" aria-hidden="true"></i></span></span></a></div>`;
  }).join('');
  observeFu();
}

async function hotInit(){
  if(hotLoaded){hotPaint();return}
  hotLoaded=true;
  try{const c=JSON.parse(sessionStorage.getItem('khip-hot-v2'));if(Array.isArray(c)){hot=c;hotPaint()}}catch{}
  try{
    if(!window.KHIP_SUPABASE)await new Promise((ok,no)=>{const e=document.createElement('script');e.src='supabase-config.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
    const C=window.KHIP_SUPABASE;if(!C||/YOUR-/.test(C.url||''))return;
    const per=Math.min(12,Math.max(1,parseInt((D.hot||{}).perSector)||6));
    const r=await fetch(C.url+'/rest/v1/rpc/hot_news',{method:'POST',headers:{apikey:C.anonKey,Authorization:'Bearer '+C.anonKey,'Content-Type':'application/json'},body:JSON.stringify({p_per:per})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    hot=await r.json();try{sessionStorage.setItem('khip-hot-v2',JSON.stringify(hot))}catch{}
  }catch(e){console.warn('HOT News not loaded',e)}
  hotPaint();
}
function hotPaint(){show('jurisdictions',hot.length);chips();pick(Math.min(jc,Math.max(0,hot.length-1)))}
function chips(){
  window.jm=hot.map((x,i)=>i);
  $('jur-chips').innerHTML=hot.map((x,i)=>`<button data-act="jur" data-i="${i}" id="chip-${i}" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm flex-shrink-0 bg-white border border-stone-300 transition"><i class="ph-light ph-fire text-base"></i>${esc(hotName(x))}<span class="text-xs opacity-70">${x.count}</span></button>`).join('');
}
let jc=0;
function pick(i){
  const j=hot[i];if(!j){$('jur-card').innerHTML='';return}
  jc=i;
  document.querySelectorAll('[id^=chip-]').forEach(b=>{const on=b.id==='chip-'+i;b.classList.toggle('bg-ink',on);b.classList.toggle('text-white',on);b.classList.toggle('border-ink',on);b.classList.toggle('bg-white',!on)});
  const ch=$('chip-'+i),box=$('jur-chips');
  if(ch){if(KLang.rtl)ch.scrollIntoView({inline:'center',block:'nearest',behavior:(window.kSmooth?kSmooth():'smooth')});else box.scrollTo({left:ch.offsetLeft-(box.clientWidth-ch.offsetWidth)/2,behavior:(window.kSmooth?kSmooth():'smooth')})}
  const c=$('jur-card');c.style.transition='opacity .3s ease,transform .3s ease';c.style.opacity=0;c.style.transform='translateX('+(-24*(KLang.rtl?-1:1))+'px)';
  setTimeout(()=>{
    c.innerHTML=`<div class="flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ph-fire text-2xl"></i></span><div class="min-w-0"><h3 class="font-display text-[1.4rem] leading-tight font-semibold text-title">${esc(hotName(j))}</h3><p class="text-xs text-stone-600">${esc(j.count===1?KLang.t('hot_n1'):KLang.t('hot_n',{x:j.count}))}</p></div></div>`
      +`<ul class="mt-4 divide-y divide-stone-200">${j.tenders.map(t=>`<li class="py-3"><p dir="auto" class="text-sm md:text-base leading-relaxed text-ink">${esc(hotWords(t.subject))}</p><div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-stone-600">${t.entity?`<span dir="auto" class="flex items-center gap-1.5 min-w-0"><i class="ph-light ph-buildings flex-shrink-0"></i><span class="min-w-0">${esc(t.entity)}</span></span>`:''}${t.publish_date?`<span class="flex items-center gap-1.5"><i class="ph-light ph-calendar-blank flex-shrink-0"></i>${esc(hotDate(t.publish_date))}</span>`:''}<button data-act="tender" data-id="${esc(t.id)}" class="ms-auto inline-flex items-center gap-1 text-brand-600 hover:underline font-semibold">${esc(KLang.t('hot_more'))}<i class="ph-light ${KLang.rtl?'ph-arrow-left':'ph-arrow-right'}"></i></button></div></li>`).join('')}</ul>`
      +`<div class="mt-5 flex flex-wrap items-center gap-3"><a href="tenders.html" class="inline-flex items-center gap-2 bg-ink hover:bg-stone-800 text-white text-sm px-6 py-2.5 rounded-full transition"><i class="ph-light ph-gavel"></i>${esc(KLang.t('hot_cta'))}</a><span class="text-xs text-stone-600">${esc(KLang.t('hot_note'))}</span></div>`;
    c.style.transition='none';c.style.transform='translateX('+(24*(KLang.rtl?-1:1))+'px)';void c.offsetWidth;
    c.style.minHeight=Math.max(parseFloat(c.style.minHeight)||0,c.scrollHeight)+'px';c.style.transition='opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1)';c.style.opacity=1;c.style.transform='none';
  },300);
}
// The sectors advance by themselves every 15 seconds
setInterval(()=>{
  const sec=$('jurisdictions'),m=window.jm||[];
  if(REDUCED||paused(sec)||m.length<2||!$('modal').classList.contains('pointer-events-none'))return;
  pick(m[(m.indexOf(jc)+1)%m.length]);
},15000);

function openModal(html){
  lastFocus=document.activeElement;$('m-body').innerHTML=html;
  $('modal').classList.remove('opacity-0','pointer-events-none');$('sheet').classList.remove('closed');$('m-scroll').scrollTop=0;
  document.body.classList.add('lock');$('sheet').querySelector('button').focus({preventScroll:true});
}
function closeModal(){
  clearInterval(relT);
  $('modal').classList.add('opacity-0','pointer-events-none');$('sheet').classList.add('closed');
  document.body.classList.remove('lock');if(location.hash.startsWith('#news-'))history.replaceState(null,'',location.pathname);
  lastFocus&&lastFocus.focus();
}
function openNews(id){
  const a=(D.news||[]).find(n=>String(n.id)===String(id));if(!a)return;
  history.replaceState(null,'','#news-'+a.id);
  openModal(`<h3 id="m-title" class="font-display text-3xl font-semibold text-title pe-10 leading-tight">${esc(a.title)}</h3><div><span class="cat-tag">${esc(cat(a))}</span>${a.date?`<span class="text-xs text-stone-600 ms-2">${esc(a.date)}</span>`:''}</div>${fxImg(a,'w-full h-52 md:h-72 rounded-2xl object-cover')}<div class="leading-relaxed">${KRich.rich(a.text||a.excerpt)}</div><button data-act="share" data-id="${esc(a.id)}" class="text-sm bg-stone-100 hover:bg-stone-200 px-4 py-2 rounded-full transition"><i class="ph-light ph-link"></i> ${KLang.t('copy_link')}</button>${related(a)}`);
  relStart();
}
// Related news: same category, shown under the article, slides by itself every 5 seconds
const cat=x=>String(x.category||'').trim()||KLang.t('general');
function related(a){
  const r=(D.news||[]).filter(n=>String(n.id)!==String(a.id)&&cat(n)===cat(a));
  if(!r.length)return '';
  return `<div id="rel" class="border-t border-stone-200 pt-5"><h4 class="font-display text-2xl font-semibold text-title mb-3">${KLang.t('related')}</h4><div id="rel-track" class="rel-track">${r.map(n=>`<button data-act="news" data-id="${esc(n.id)}" class="rel-card card text-start overflow-hidden">${fxImg(n,'w-full h-28 object-cover',1)}<div class="p-3"><h5 class="font-display text-lg font-semibold text-title leading-snug line-clamp-2">${esc(n.title)}</h5>${n.date?`<span class="text-xs text-stone-600">${esc(n.date)}</span>`:''}</div></button>`).join('')}</div></div>`;
}
let relT=0,relHold=false;
function relStart(){
  clearInterval(relT);const tr=$('rel-track');if(!tr)return;
  tr.addEventListener('mouseenter',()=>relHold=true);tr.addEventListener('mouseleave',()=>relHold=false);
  tr.addEventListener('touchstart',()=>relHold=true,{passive:true});tr.addEventListener('touchend',()=>setTimeout(()=>relHold=false,3000),{passive:true});
  relT=setInterval(()=>{
    const t=$('rel-track');if(!t){clearInterval(relT);return}
    if(REDUCED||KPAUSE.on||relHold||t.scrollWidth<=t.clientWidth+4)return;
    const c=t.firstElementChild,step=(c.offsetWidth+12)*(KLang.rtl?-1:1);
    if(Math.abs(t.scrollLeft)+t.clientWidth>=t.scrollWidth-4)t.scrollTo({left:0,behavior:(window.kSmooth?kSmooth():'smooth')});else t.scrollBy({left:step,behavior:(window.kSmooth?kSmooth():'smooth')});
  },5000);
}
function openService(i){
  const x=(D.services||[])[i];if(!x)return;
  const more=/^[\w\-]+\.html$/.test(x.page||'');
  openModal(`<div class="flex items-center gap-4 pe-10"><div class="w-14 h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ${icon(x)} text-3xl"></i></div><h3 id="m-title" class="font-display text-3xl font-semibold text-title leading-tight">${esc(x.title)}</h3></div><div class="leading-relaxed">${KRich.rich(x.description)}</div>${x.details&&x.details.trim()?`<div class="bg-stone-50 p-5 rounded-2xl border border-stone-200 text-sm leading-relaxed">${KRich.rich(x.details)}</div>`:''}${more?`<a href="${esc(x.page)}" class="block text-center w-full bg-ink hover:bg-stone-800 text-white py-3 rounded-full text-sm transition">${KLang.t('more_info')}</a>`:''}<button data-act="inquire" data-q="${esc(x.title)}" class="w-full bg-sand hover:brightness-95 text-ink py-3 rounded-full text-sm transition"><i class="ph-light ph-whatsapp-logo"></i> ${esc(KLang.t('inquire_about',{x:x.title}))}</button>`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const {act,i,id,q}=t.dataset;
  if(act==='close'){if(e.target===t||t.tagName==='BUTTON')closeModal()}
  else if(act==='jur')pick(+i);else if(act==='news')openNews(id);else if(act==='tender')openTender(id);
  else if(act==='service')openService(+i);else if(act==='tslide')setT(+i);else if(act==='nslide')setN(+i);else if(act==='inquire')KHIP.wa(KLang.t('wa_service',{x:q}));
  else if(act==='retry')load();
  else if(act==='share'){const u=location.origin+location.pathname+'#news-'+id;(navigator.share?navigator.share({url:u}):navigator.clipboard.writeText(u)).then(()=>t.textContent=KLang.t('link_copied')).catch(()=>{})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Tab'&&!$('modal').classList.contains('pointer-events-none')){
    const f=[...$('sheet').querySelectorAll('button,a[href]')],a=document.activeElement;
    if(e.shiftKey&&a===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&a===f.at(-1)){e.preventDefault();f[0].focus()}
  }
});
// Fade-up on scroll: sections, and individual .fu items
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
const observeFu=()=>document.querySelectorAll('.fu:not(.in)').forEach(e=>io.observe(e));
document.querySelectorAll('main section:not(#about):not(#services)').forEach(x=>{x.classList.add('rv');io.observe(x)});
observeFu();
KLang.dom();
load();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline | HOT INFORMATION</title><meta name="robots" content="noindex"><meta name="theme-color" content="#1d4ed8">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafaf9;color:#1c1917;font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:1.5rem;box-sizing:border-box}
  .c{max-width:30rem;text-align:center;background:#fff;border:1px solid #e7e5e4;border-radius:1.5rem;padding:2.25rem 1.75rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  h1{font-size:1.5rem;margin:.25rem 0 .5rem}p{line-height:1.7;margin:.4rem 0;color:#57534e}
  .ar{direction:rtl;border-top:1px solid #e7e5e4;margin-top:1.25rem;padding-top:1.1rem}
  button{margin-top:1.25rem;border:0;border-radius:999px;background:#1c1917;color:#fff;padding:.7rem 1.75rem;font-size:.95rem;cursor:pointer}
  .i{font-size:2.5rem}
</style>
</head>
<body>
<div class="c" role="main">
  <div class="i" aria-hidden="true">&#128246;</div>
  <h1>You are offline</h1>
  <p>This page is not saved on your device yet. Check your connection and try again. Pages you opened before still work.</p>
  <div class="ar" lang="ar"><h1>لا يوجد اتصال بالإنترنت</h1><p>هذه الصفحة غير محفوظة على جهازك بعد. تأكد من اتصالك ثم حاول مرة أخرى. الصفحات التي فتحتها من قبل تعمل بدون إنترنت.</p></div>
  <button onclick="location.reload()">Try again &middot; حاول مرة أخرى</button>
</div>
</body>
</html>
